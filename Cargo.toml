[package]
name = "md-pdf"
version = "0.1.2"
edition = "2024"
authors = ["tschinz"]
license = "MIT"
description = "Convert markdown files to PDF using typst with templating"
readme = "README.md"
repository = "https://github.com/tschinz/md-pdf"
categories = ["command-line-utilities", "multimedia", "template-engine"]
keywords = ["markdown", "pdf", "typst", "converter", "templating"]
exclude = [
  ".github"
]

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
duct = "1.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ron = "0.8"
dirs = "5.0"
notify = "6.1"
# Use rustls-tls instead of default OpenSSL for better CI compatibility
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"], default-features = false }
regex = "1.12"
opener = "0.7"

[dev-dependencies]
tempfile = "3.24"
