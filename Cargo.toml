[package]
name = "md-pdf"
version = "0.3.0"
edition = "2024"
authors = ["tschinz"]
license = "MIT"
description = "Convert markdown files to PDF using typst with templating"
readme = "README.md"
repository = "https://github.com/tschinz/md-pdf"
categories = ["command-line-utilities", "multimedia", "template-engine"]
keywords = ["markdown", "pdf", "typst", "converter", "templating"]
exclude = [
  ".github",
  # Private templates kept only in the author's dotfiles, not published
  "templates/letter.typ",
  "templates/professional.typ"
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ron = "0.8"
dirs = "6.0"
notify = "6.1"
regex = "1.13"
opener = "0.7"
# HTTP client for the link checker, shared with the Typst package downloader
ureq = "3"
# Embedded Typst compiler, built on typst-kit (the toolkit behind the Typst CLI):
# system and bundled fonts, @preview package downloads, CLI-style diagnostics
typst = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts", "system-files", "emit-diagnostics", "datetime"] }
typst-layout = "0.15"
typst-pdf = "0.15"
comemo = "0.5"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
# Strip symbols to keep the self-contained binary (embedded Typst) small
strip = true
